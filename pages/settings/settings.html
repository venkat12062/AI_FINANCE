<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - AI Finance Manager</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/pages/settings/settings.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="/pages/dashboard/dashboard.html" class="sidebar-logo">
                    <i class="fas fa-brain"></i>
                    <span>FinanceAI</span>
                </a>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-section-title">Core</div>
                <a href="/pages/dashboard/dashboard.html" class="nav-item">
                    <i class="fas fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/pages/income/income.html" class="nav-item">
                    <i class="fas fa-arrow-trend-up"></i>
                    <span>Income</span>
                </a>
                <a href="/pages/expenses/expenses.html" class="nav-item">
                    <i class="fas fa-arrow-trend-down"></i>
                    <span>Expenses</span>
                </a>
                <a href="/pages/budgets/budgets.html" class="nav-item">
                    <i class="fas fa-wallet"></i>
                    <span>Budgets</span>
                </a>
                <a href="/pages/categories/categories.html" class="nav-item">
                    <i class="fas fa-tags"></i>
                    <span>Categories</span>
                </a>

                <div class="nav-section-title">Intelligence & Tools</div>
                <a href="/pages/reports/reports.html" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Reports</span>
                </a>
                <a href="/pages/ai-insights/ai-insights.html" class="nav-item">
                    <i class="fas fa-wand-magic-sparkles"></i>
                    <span>AI Insights</span>
                </a>
                <a href="/pages/receipts/receipts.html" class="nav-item">
                    <i class="fas fa-receipt"></i>
                    <span>Receipt OCR</span>
                </a>
                <a href="/pages/voice/voice.html" class="nav-item">
                    <i class="fas fa-microphone"></i>
                    <span>Voice Assistant</span>
                </a>

                <div class="nav-section-title">Account</div>
                <a href="/pages/notifications/notifications.html" class="nav-item">
                    <i class="fas fa-bell"></i>
                    <span>Notifications</span>
                    <span class="nav-badge" id="sidebar-notif-badge" style="display:none;">0</span>
                </a>
                <a href="/pages/settings/settings.html" class="nav-item active">
                    <i class="fas fa-gear"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile-badge">
                    <div class="user-avatar" id="sidebar-avatar">A</div>
                    <div class="user-info">
                        <div class="user-name" id="sidebar-user-name">User</div>
                        <div class="user-role">Free Tier</div>
                    </div>
                    <a href="#" id="logout-btn" title="Logout" style="color: var(--text-muted);"><i class="fas fa-arrow-right-from-bracket"></i></a>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-wrapper">
            <!-- Header -->
            <header class="top-header">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="mobile-nav-toggle" id="mobile-menu-btn"><i class="fas fa-bars"></i></button>
                    <div class="header-search">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Search settings...">
                    </div>
                </div>

                <div class="header-actions">
                    <a href="/pages/notifications/notifications.html" class="header-btn" title="Notifications">
                        <i class="fas fa-bell"></i>
                        <span class="badge-dot" id="header-notif-dot" style="display:none;"></span>
                    </a>
                </div>
            </header>

            <div class="content-body">
                <!-- Page Title -->
                <div class="page-header">
                    <div class="page-title-group">
                        <h1>Account Settings</h1>
                        <p>Manage your profile, password security, and system preferences.</p>
                    </div>
                </div>

                <div id="global-alert" class="alert hidden" style="margin-bottom: 1.5rem;"></div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <!-- PROFILE FORM -->
                    <div class="card card-glass">
                        <div class="card-header">
                            <div class="card-title"><i class="fas fa-user-gear text-primary"></i> Personal Profile</div>
                        </div>
                        <form id="profile-form">
                            <div class="form-group">
                                <label class="form-label" for="profile-name">Full Name</label>
                                <input type="text" id="profile-name" class="form-control" required>
                                <small class="error-text" id="profile-name-error" style="color:var(--danger);"></small>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="profile-email">Email Address</label>
                                <input type="email" id="profile-email" class="form-control" required>
                                <small class="error-text" id="profile-email-error" style="color:var(--danger);"></small>
                            </div>
                            <button type="submit" id="save-profile-btn" class="btn btn-primary">
                                <i class="fas fa-floppy-disk"></i> Update Profile
                            </button>
                        </form>
                    </div>

                    <!-- PASSWORD FORM -->
                    <div class="card card-glass">
                        <div class="card-header">
                            <div class="card-title"><i class="fas fa-shield-halved text-secondary"></i> Security & Password</div>
                        </div>
                        <form id="password-form">
                            <div class="form-group">
                                <label class="form-label" for="current-password">Current Password</label>
                                <input type="password" id="current-password" class="form-control" required>
                                <small class="error-text" id="current-password-error" style="color:var(--danger);"></small>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="new-password">New Password</label>
                                <input type="password" id="new-password" class="form-control" required>
                                <small class="error-text" id="new-password-error" style="color:var(--danger);"></small>
                            </div>
                            <button type="submit" id="save-password-btn" class="btn btn-primary">
                                <i class="fas fa-key"></i> Change Password
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/pages/settings/settings.js"></script>
</body>
</html>
