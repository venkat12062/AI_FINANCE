<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Finance Manager</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header text-center">
                <h2>Create an Account</h2>
                <p>Join AI Finance Manager to track your expenses smartly.</p>
            </div>
            
            <div id="alert-box" class="alert hidden"></div>
            
            <form id="register-form" novalidate>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user icon"></i>
                        <input type="text" id="name" name="name" placeholder="John Doe" autocomplete="name" required>
                    </div>
                    <small class="error-text" id="name-error"></small>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope icon"></i>
                        <input type="email" id="email" name="email" placeholder="john@example.com" autocomplete="email" required>
                    </div>
                    <small class="error-text" id="email-error"></small>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock icon"></i>
                        <input type="password" id="password" name="password" placeholder="Create a strong password" autocomplete="new-password" required>
                        <i class="fas fa-eye-slash toggle-password" id="toggle-password"></i>
                    </div>
                    
                    <div class="password-strength-container">
                        <div class="strength-bar-wrapper">
                            <div class="strength-bar" id="strength-bar"></div>
                        </div>
                        <span class="strength-text" id="strength-text">Weak</span>
                    </div>
                    <ul class="password-rules">
                        <li id="rule-length"><i class="fas fa-times"></i> Min 8 chars</li>
                        <li id="rule-upper"><i class="fas fa-times"></i> 1 Uppercase</li>
                        <li id="rule-lower"><i class="fas fa-times"></i> 1 Lowercase</li>
                        <li id="rule-number"><i class="fas fa-times"></i> 1 Number</li>
                        <li id="rule-special"><i class="fas fa-times"></i> 1 Special Char</li>
                    </ul>
                    <small class="error-text" id="password-error"></small>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock icon"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" required>
                        <i class="fas fa-eye-slash toggle-password" id="toggle-confirm"></i>
                    </div>
                    <small class="error-text" id="confirmPassword-error"></small>
                </div>
                
                <button type="submit" id="submit-btn" class="btn btn-primary full-width">
                    <span id="btn-text">Register</span>
                    <i class="fas fa-spinner fa-spin hidden" id="btn-spinner"></i>
                </button>
            </form>
            
            <div class="auth-footer text-center">
                <p>Already have an account? <a href="/pages/login/login.html" class="link">Login here</a></p>
                <p><a href="/index.html" class="link-muted"><i class="fas fa-arrow-left"></i> Back to Home</a></p>
            </div>
        </div>
    </div>
    <script src="register.js"></script>
</body>
</html>
